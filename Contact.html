<!DOCTYPE html>
<html>
<head>
  <title>Travel Picker - Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header-container">
        <div class="logo">
            <a href="url" style="text-decoration: none; font-weight: bold; font-size: 1.5em; color: #333;">Travel Picker</a>
        </div>

        <nav class="nav-links">
            <a href="travel_recommendation.html">Home</a>
            <a href="About.html">About us</a>
            <a href="Contact.html">Contact Us</a> 
        </nav>
        
        <form class="search-form" action="/search" method="get">
            <input type="search" id="query" name="search" placeholder="Search...">
            <button type="submit">Search</button>
            <button type="button" onclick="document.getElementById('query').value=''">Clear</button>
        </form>
    </div>
    
    <div class="contactpage">
        <div class="contactPageTxt">
            <h1>CONTACT US</h1>

            <p>Get in touch</p>
        </div>
        <div class="contactInputArea">
            <form action="/contact_page.json">
                <p><label for="namefield">Name</label></p>
                <input id="namefield" name="namefield" placeholder="Enter your name">
                <br>
                <p><label for "emailfield">Email</label></p>
                <input id="emailfield" name"emailfield" placeholder="Enter your email">
                <br>
                <p><label for="messagefield">Message</label></p>
                <textarea id="messagefield" name="messagefield" rows="5" cols="40" placeholder="enter your message"></textarea>

                <input type="submit" value="Submit">
              </form>
        </div>
    </div>

    
</body>
<script src="travel_recommendation.js"></script>
</html>
